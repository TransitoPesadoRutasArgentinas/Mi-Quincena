
name: Crear APK Mi Quincena

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear proyecto Android
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/ar/miquincena/app
          mkdir -p app/src/main/res/drawable

          cp index.html app/src/main/assets/
          cp icon-192.png app/src/main/res/drawable/icon.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'MiQuincena'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ar.miquincena.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'ar.miquincena.app'
                  minSdk 24
                  targetSdk 28
                  versionCode 31
                  versionName '3.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Mi Quincena"
                  android:icon="@drawable/icon"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/ar/miquincena/app/MainActivity.java <<'EOF'
          package ar.miquincena.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  WebView web = new WebView(this);
                  web.setWebViewClient(new WebViewClient());

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Preparar APK descargable
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk \
             salida/Mi-Quincena-3.1.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Quincena-3.1
          path: salida/Mi-Quincena-3.1.apk
          
